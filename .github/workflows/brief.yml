name: AI 음성 브리핑 만들기
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/data/market_reports.csv'
      - 'dashboard/data/market_news.csv'
      - 'dashboard/data/investor_flows.csv'
      - 'dashboard/data/calendar.csv'
      - 'scripts/brief_script.py'
      - 'scripts/tts_brief.py'
      - '.github/workflows/brief.yml'
  workflow_dispatch:
concurrency:
  group: brief
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/brief.yml
      - name: 음성 만들기
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy
          melo() {
            pip install -q torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q git+https://github.com/myshell-ai/MeloTTS.git
            python -m unidic download
            FORCE_MELO=1 python scripts/tts_brief.py
          }
          if [ -n "$ELEVENLABS_API_KEY" ] && [ -n "$ELEVENLABS_VOICE_ID" ]; then
            python scripts/tts_brief.py || { echo "ElevenLabs 실패, MeloTTS로 대체"; melo; }
          else
            melo
          fi
      - name: 올리기
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add dashboard/data/brief.mp3 dashboard/data/brief.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "AI 음성 브리핑 갱신"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
