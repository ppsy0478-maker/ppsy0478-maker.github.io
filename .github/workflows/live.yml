# 장중 시세: 도쿄 장중(평일 9:00~15:30 JST)에 10분마다 야후재팬 62종목 현재가를 받아 dashboard/data/live.json 갱신
name: live-quotes
on:
  schedule:
    - cron: '3-59/10 0-5 * * 1-5'   # 09:03~14:53 JST, 10분마다 (정각은 깃허브가 붐벼서 3분 늦춤)
    - cron: '3,13,23,33,43 6 * * 1-5' # 15:03~15:43 JST (15:30 종가 반영)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-quotes
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/live_quotes.py
      - name: commit
        run: |
          git config user.name "live-quotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/data/live.json dashboard/data/live_hist.json 2>/dev/null || git add dashboard/data/live.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update live quotes"
          git pull --rebase origin main && git push origin HEAD:main
